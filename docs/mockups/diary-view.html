<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary View Mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f2; margin: 0; min-height: 100vh; }
    .diary-header { background: #185ADB; padding: 16px; position: sticky; top: 0; z-index: 10; }
    .diary-title { color: white; font-size: 18px; font-weight: 700; text-align: center; }
    .diary-content { padding: 16px; background: #f2f2f2; }
    .meal-section { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .meal-header { background: #185ADB; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .meal-header-left { display: flex; align-items: center; gap: 8px; }
    .meal-header-right { display: flex; align-items: center; gap: 8px; }
    .meal-header span { color: white; }
    .meal-label { font-weight: 700; }
    .meal-cal { font-size: 14px; }
    .log-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e0e0e0; cursor: pointer; }
    .log-row:last-child { border-bottom: none; }
    .log-row:hover { background: #fafafa; }
    .log-info { flex: 1; min-width: 0; margin-right: 8px; }
    .log-name { font-size: 14px; font-weight: 500; color: #212121; }
    .log-brand { font-size: 12px; color: #757575; margin-top: 2px; }
    .log-macros { font-size: 12px; color: #757575; margin-top: 2px; }
    .log-photo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; margin-right: 12px; flex-shrink: 0; background: #e8e8e8; }
    .log-photo-placeholder { width: 40px; height: 40px; border-radius: 8px; background: #e8e8e8; flex-shrink: 0; margin-right: 12px; display: flex; align-items: center; justify-content: center; }
    .log-actions { flex-shrink: 0; padding-left: 8px; }
    .delete-btn { color: #757575; cursor: pointer; padding: 4px; }
    .add-food-btn { width: 100%; padding: 12px; text-align: left; font-size: 14px; font-weight: 500; color: #185ADB; border-top: 1px solid #e0e0e0; background: white; cursor: pointer; border-radius: 0 0 12px 12px; }
  </style>
</head>
<body>
  <div class="diary-header">
    <div class="diary-title">Today</div>
  </div>
  <div class="diary-content">
    <!-- Breakfast (empty) -->
    <div class="meal-section">
      <div class="meal-header">
        <div class="meal-header-left">
          <span>☀️</span>
          <span class="meal-label">Breakfast</span>
        </div>
        <div class="meal-header-right">
          <span class="meal-cal">0 cal</span>
          <svg style="width:16px;height:16px;transform:rotate(90);" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div style="padding:12px 16px; font-size:14px; color:#757575;">0 calories</div>
      <button class="add-food-btn">+ Add Food</button>
    </div>

    <!-- Lunch (with items) -->
    <div class="meal-section">
      <div class="meal-header">
        <div class="meal-header-left">
          <span>🌤️</span>
          <span class="meal-label">Lunch</span>
        </div>
        <div class="meal-header-right">
          <span class="meal-cal">520 cal</span>
          <svg style="width:16px;height:16px;" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <!-- Log with photo -->
      <div class="log-row">
        <div class="log-photo-placeholder">🍗</div>
        <div class="log-info">
          <div class="log-name">Grilled Chicken Breast</div>
          <div class="log-macros">310 cal · P:46g C:0g F:10g</div>
        </div>
        <div class="log-actions">
          <div class="delete-btn">✕</div>
        </div>
      </div>
      <!-- Log without photo -->
      <div class="log-row">
        <div class="log-info" style="margin-left:52px;">
          <div class="log-name">Brown Rice</div>
          <div class="log-brand">USDA</div>
          <div class="log-macros">210 cal · P:5g C:45g F:2g</div>
        </div>
        <div class="log-actions">
          <div class="delete-btn">✕</div>
        </div>
      </div>
      <button class="add-food-btn">+ Add Food</button>
    </div>

    <!-- Dinner (empty) -->
    <div class="meal-section">
      <div class="meal-header">
        <div class="meal-header-left">
          <span>🌙</span>
          <span class="meal-label">Dinner</span>
        </div>
        <div class="meal-header-right">
          <span class="meal-cal">0 cal</span>
          <svg style="width:16px;height:16px;transform:rotate(90);" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div style="padding:12px 16px; font-size:14px; color:#757575;">0 calories</div>
      <button class="add-food-btn">+ Add Food</button>
    </div>

    <!-- Snacks (empty) -->
    <div class="meal-section">
      <div class="meal-header">
        <div class="meal-header-left">
          <span>🍎</span>
          <span class="meal-label">Snacks</span>
        </div>
        <div class="meal-header-right">
          <span class="meal-cal">0 cal</span>
          <svg style="width:16px;height:16px;transform:rotate(90);" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div style="padding:12px 16px; font-size:14px; color:#757575;">0 calories</div>
      <button class="add-food-btn">+ Add Food</button>
    </div>
  </div>
</body>
</html>
