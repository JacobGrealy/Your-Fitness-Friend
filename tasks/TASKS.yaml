- id: FF-0008
  title: Serve AweFit over Tailscale HTTPS
  source: agent
  projects:
  - awecraft
  assignee: opencode
  priority: 2
  status: done
  labels: []
  created_at: 2026-10-17T16:17
  updated_at: 2026-10-17T18:24
  completed_at: 2026-10-17T18:24
  waiting_on: null
  parent_id: null
  notes: '1) User Story: As the owner I want a stable HTTPS address for AweFit so the APK never needs
    rebuilding when DHCP moves the LAN IP, and switching Wi-Fi to cellular does not log me out.


    2) Technical Details: tailscale serve/cert for the .ts.net name proxying :5001, ANDROID_SERVER_URL
    pointing at it, CORS_ORIGINS updated, verify the Flask-Login cookie survives HTTPS (SESSION_COOKIE_SECURE)
    and consider relaxing login_manager.session_protection from strong to basic, since strong binds the
    session to IP + user agent and invalidates on network change.


    BLOCKED on owner (Q1 in QUESTIONS.md): tailscale serve is not enabled on the tailnet (console URL
    in the question) and CertDomains is empty, so HTTPS certs are off; operator unset so serve needs root.
    Landed the parts that need no Tailscale: SESSION_PROTECTION configurable, default basic (strong logged
    the phone out on every network switch); SESSION_COOKIE_SECURE/SAMESITE no longer hardcoded over config
    (were silently overriding); README Tailscale HTTPS section.


    Closed: Tailscale Serve is live at https://home-server-1.tail96ee52.ts.net (Let''s Encrypt cert via
    Tailscale, verified by openssl and Chromium; deep links and API work through the proxy; 13ms warm).
    APK 0.1.3 / versionCode 4 bakes that URL with cleartext:false, is apksigner-verified, and version.json
    matches. Found and fixed a double-default trap: build-android.sh exports its own fallback which overrode
    capacitor.config.ts - the first 0.1.3 still baked http. Both now default to HTTPS and the script warns
    on cleartext. SESSION_COOKIE_SECURE=true added to .env (awaits restart; stops plain-LAN logins by
    design).'
  comments: []
