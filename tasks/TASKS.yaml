    it without a cable, since this is my daily driver.


    2) Technical Details: scripts/build-android.sh runs the env setup, npm run android:sync, ./gradlew
    assembleRelease, then copies the signed APK to a served path (app/static/download/awefit.apk, gitignored)
    so https://<host>/download/awefit.apk downloads it; prints versionCode, versionName and sha256; verifies
    the APK is signed with the release key (apksigner verify).


    Closed: scripts/build-android.sh builds+signs+publishes; APK served by the live gunicorn at /download/awefit.apk
    (verified 200, application/vnd.android.package-archive, sha256 matches the build) with /download/version.json
    metadata; README documents install and update. Signature verified with apksigner before publish. --bump
    increments versionCode so updates install in place.'
