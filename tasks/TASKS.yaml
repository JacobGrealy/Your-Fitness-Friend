    \ spec). Add frontend/tests/pages/EditWeight.photo.test.tsx with at least: an entry with a photo renders\
    \ the img on mount (even when the store still holds a stale uploadedPhotoUrl); saving without touching\
    \ the photo sends a body with NO photo_url key; picking a file then pressing Save once sends the uploaded\
    \ URL; explicit Remove sends null. Mock axios the way the other page tests do, and keep the qwen_client\
    \ stub convention (route tests never call the local model).\n\n4) Acceptance Criteria: opening an\
    \ entry that has a photo shows it, every visit, regardless of what other screens did earlier in the\
    \ session; saving without touching the photo leaves it intact (assert the PUT body omits photo_url);\
    \ picking a new photo and pressing Save attaches it in one step with no leftover orphan file; explicit\
    \ Remove clears it; LogWeight's create path behaves the same; gates green via ./scripts/gates.sh.\n\
    \n5) Note for scheduling: this is frontend-only unless update_log changes, so the fix ships in a rebuilt\
    \ app/static with no gunicorn restart. It touches EditWeight.tsx and WeightHistory.tsx, which FF-0074\
    \ also touches - run those two in the same lane, sequentially, never in parallel.\n\n\n6) Fix-shape\
    \ caveat found while filing FF-0075 (verified, so it is not re-derived): weightStore.uploadPhoto DOES\
    \ `throw error` on failure (frontend/src/store/weightStore.ts:129), unlike useFoodStore.uploadFoodLogPhoto\
    \ which swallows and resolves. So `const url = await uploadPhoto(file)` inside onSubmit is safe here\
    \ - a failed upload rejects and aborts the save instead of handing back undefined. Do not \"harmonise\"\
    \ the two stores by removing that throw; the food log needs the throw added, which is FF-0075. Also\
    \ note axios drops keys whose value is `undefined`, so sending `photo_url: undefined` would omit the\
    \ key and silently PRESERVE the old photo - guard the null case explicitly rather than relying on\
    \ that.\n\nClosed: onSubmit now states save intent explicitly - picked file uploaded first and its\
    \ returned URL used, explicit Remove sends null, untouched omits the key (built into the payload object\
    \ in weightStore.updateLog too, not left to axios dropping undefined). Also found and fixed two things\
    \ the ticket could not know: a saved photo had no remove control at all (the X existed only on the\
    \ picked-file preview), and a failed upload rejected instead of aborting (unhandled rejection on the\
