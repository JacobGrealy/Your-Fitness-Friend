    so it cannot drift again, mapping ''snack'' to the label "Snacks". Verify with a Dashboard test that
    renders a snack log and asserts both the Snacks row and the header total; the existing diary already
    labels ''snack'' as "Snacks" (MEAL_LABELS in DailyFood.tsx), so the two screens will finally agree.


