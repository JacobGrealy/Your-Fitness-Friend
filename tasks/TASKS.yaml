  waiting_on: null
  parent_id: null
  notes: '1) User Story: the Home screen''s weight trend does not include today''s weigh-in. If I weigh
    myself today, the Home graph still stops at yesterday.


    2) Root cause, PROVEN against the live database (read-only), not assumed: app/utils/aggregations.py
    get_weight_trend() filters `WeightLog.recorded_at >= start_date` and `<= end_date` where those are
    bare `datetime.date` objects, but `recorded_at` is a db.DateTime stored as TEXT ''2026-10-19 00:00:00.000000''.
    SQLite compares text, and ''2026-10-19 00:00:00.000000'' <= ''2026-10-19'' is FALSE, so EVERY entry
    dated the end day is dropped no matter what time it was recorded. Evidence on the owner''s data (user
    6): current filter returns ids 12 (10-18) and 11 (10-17); the same query with date(recorded_at) returns
    13 (10-19, 257.5 lb) as well. Today''s row exists and is simply filtered out.


    3) The correct pattern already exists in this codebase: app/routes/weight.py:35/42 and 266/273 use
    `datetime.combine(start, datetime.min.time())` and `datetime.combine(end, datetime.max.time())`. aggregations.py
    is the outlier. Fix both occurrences: get_weight_trend() (lines ~74-79) and the weekly summary''s
    WeightLog query (lines ~202-205, week_start/week_end have the same defect).


    4) Do NOT change the API shape: the endpoint returns {date: ''YYYY-MM-DD'', weight_lbs} and the frontend''s
    utils/weightTrend.buildWeightSeries already handles date-only strings correctly (FF-0084), so today''s
    row will appear once it is returned. Verify the dashboard endpoint now includes today for a user whose
    only weigh-in is today.


    5) Acceptance: /api/dashboard/weight-trend returns an entry dated today when one exists; a weigh-in
    timestamped later today still appears; the weekly summary counts a weigh-in from the end day; regression
    tests that fail against the old filter and pass now (a log created ''today'' must be returned by a
    7 day window); ./scripts/gates.sh green.


    Root cause proven against the live DB: recorded_at is a DateTime stored as ''YYYY-MM-DD HH:MM:SS.ffffff''
    but was filtered against bare date objects, and lexicographic comparison puts the stored value after
    the bare end date, so every entry dated the end day was dropped at any time of day. Fixed get_weight_trend()
    and the weekly summary''s WeightLog query with datetime.combine(min/max time), the pattern app/routes/weight.py
    already used. api shape unchanged, so the FF-0084 frontend needed no change. 6 regression tests (midnight,
    morning, late evening, full window, yesterday only, out of window); 4 of them fail against the old
    code.'
