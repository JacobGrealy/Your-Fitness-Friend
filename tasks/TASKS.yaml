    / FoodLog.meal_type), so groupMealsByType built the snack group and the order filter discarded it
    - hiding the row AND under-counting the section header total. Order now derives from MEAL_TYPES and
    the label map uses ''snack'' -> Snacks. 4 new tests; confirmed they fail against the unfixed file
