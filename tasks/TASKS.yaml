- id: FF-0043
  title: Stay signed in on the phone across app restarts
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 1
  status: done
  labels: []
  created_at: 2026-10-17T19:04
  updated_at: 2026-10-17T19:08
  completed_at: 2026-10-17T19:08
  waiting_on: null
  parent_id: null
  notes: '1) User Story: Opening AweFit on the phone means typing the email and password every single
    time. The app should stay signed in across app restarts and phone reboots, until the user logs out.


    2) Technical Details: two causes, both confirmed by reading the code. (a) app/routes/auth.py calls
    login_user(user, remember=remember) and honours a ''remember'' flag, but nothing ever sends it: frontend/src/api/auth.ts
    login() posts LoginCredentials with no remember field, so the Flask-Login remember_token cookie is
    never issued. (b) session.permanent is never set anywhere in app/ - grep finds no SESSION_PERMANENT
    and no session.permanent assignment - so Flask emits the session cookie WITHOUT Expires/Max-Age. That
    makes it a session cookie, and an Android WebView keeps session cookies in memory: kill the app and
    the login is gone. Fix: set session.permanent = True on login (and on the auto-login after register),
    pass remember: true from the frontend, and configure REMEMBER_COOKIE_DURATION, REMEMBER_COOKIE_SECURE
    (tied to SESSION_COOKIE_SECURE), REMEMBER_COOKIE_HTTPONLY and REMEMBER_COOKIE_SAMESITE in app/config.py.
    Raise PERMANENT_SESSION_LIFETIME from 7 days to 30 for a daily-driver phone. Verify with tests: a
    login with remember=true sets a remember_token cookie and a Set-Cookie carrying Expires/Max-Age; a
    login without remember sets no remember_token. NOTE the deploy ordering trap: .env already has SESSION_COOKIE_SECURE=true
    pending restart, so if the backend is restarted while the user still has APK 0.1.2 installed (which
    points at plain http://100.84.29.20:5001), login will break - 0.1.3 (HTTPS) must be installed first.


    Closed: root causes were (a) session.permanent never set, so no Expires on the session cookie and
    an Android WebView drops session cookies with the process; (b) the client never sent remember, so
    Flask-Login never issued remember_token. Now permanent on login and on post-register auto-login, client
    sends remember=true, lifetime 30 days, remember cookie 365 days Secure/SameSite=Lax/HttpOnly tied
    to SESSION_COOKIE_SECURE. 4 backend + 1 frontend test. Deploy order: install APK 0.1.3 before restarting,
    because SESSION_COOKIE_SECURE=true lands in the same restart.'
