  assignee: opencode
  priority: 2
  status: done
  labels: []
  created_at: 2026-10-18T12:15
  updated_at: 2026-10-18T21:53
  completed_at: 2026-10-18T21:53
  waiting_on: null
  parent_id: null
  notes: '1) User Story: Copy a whole meal - every food logged in it - from any meal on any date to any
    meal on any date, the way MyFitnessPal does. The entry point should be the meal itself in the diary,
    not a separate screen: you look at Breakfast, see it was a good day, and duplicate it onto today''s
    lunch.


    2) Behaviour: the copy control belongs on each meal section in the diary (frontend/src/pages/Food/DailyFood.tsx,
    which renders MEAL_TYPES through MealSection.tsx). Tapping it opens a small sheet with two choices
    - destination date and destination meal type - defaulting to TODAY (utils/localDate.todayLocal(),
    never an ISO-split) and to the meal type being copied from, so the common case is one tap plus confirm.
    Everything logged in that meal on that date is duplicated onto the destination.


    3) Technical Details: no new endpoint is strictly required - POST /api/food/log already creates a
    log from a name/macros payload - but a batch route is better: one request, one transaction, so a copy
    is all-or-nothing and does not fire N separate toast and refresh cycles. Suggested shape: POST /api/food/log/copy
    with {from_date, from_meal_type, to_date, to_meal_type}, owner-scoped, returning the created logs.
    Copy each log''s own snapshot (food_name, macros, number_of_servings, serving_size, brand, barcode_id)
    rather than re-reading the linked Food, because a log deliberately keeps its own nutrition snapshot
    (see the Edit Food Log design in DECISIONS.md) and a copy must not silently change what was eaten.
    Do NOT copy photo_url: a meal photo belongs to that meal on that day and duplicating the path would
    point two rows at one file with no clear owner - decide this explicitly and note it. Handle the destination
    meal already having entries (append, do not replace) and say so in the confirmation. Watch the date
    boundary: use localDateOf/todayLocal, the FF-0059 bug class.


    4) UX detail: show how many items will be copied in the confirmation ("Copy 3 items to Lunch on Today?"),
    disable the action when the source meal is empty, and confirm with a toast naming the destination.
    Consider also offering "copy to same meal, next day" as a shortcut later - out of scope now.


    5) Tests: backend - copies all items of the source meal onto the destination, leaves the source untouched,
    appends rather than replaces, refuses another user''s data, handles an empty source, and copies the
    snapshot rather than the linked food''s current macros. Frontend - the sheet defaults to today and
    the source meal type, the action is disabled for an empty meal, and a successful copy reports the
    destination. Gates green.'
