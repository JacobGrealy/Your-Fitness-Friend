    2) Technical Details: frontend/src/pages/Dashboard.tsx keys its meal order on ''snacks'' (plural)
    - MEAL_TYPE_LABELS and MEAL_TYPE_ORDER - while the data uses ''snack'' (singular): MEAL_TYPES in frontend/src/utils/constants.ts,
    FoodLog.meal_type in the model, and get_daily_meals in app/utils/aggregations.py, which passes log.meal_type
    through untouched. groupMealsByType groups by meal.meal_type.toLowerCase() and then filters on MEAL_TYPE_ORDER,
    so a ''snack'' group is built and then thrown away by the filter. Fix by deriving the order from MEAL_TYPES
    so it cannot drift again, mapping ''snack'' to the label "Snacks". Verify with a Dashboard test that
    renders a snack log and asserts both the Snacks row and the header total; the existing diary already
    labels ''snack'' as "Snacks" (MEAL_LABELS in DailyFood.tsx), so the two screens will finally agree.


    Closed: Dashboard.tsx keyed its meal order on ''snacks'' while the data uses ''snack'' (MEAL_TYPES
    / FoodLog.meal_type), so groupMealsByType built the snack group and the order filter discarded it
    - hiding the row AND under-counting the section header total. Order now derives from MEAL_TYPES and
    the label map uses ''snack'' -> Snacks. 4 new tests; confirmed they fail against the unfixed file
    (3 of 4).'
