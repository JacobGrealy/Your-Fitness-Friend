  notes: "1) User Story: On More (Profile), tapping my profile picture circle should open a screen showing\
    \ the full photo, where I can adjust the crop and save it. Today the only way to change how my photo\
    \ is framed is to pick a brand-new file from the gallery, which loses the one I already have.\n\n\
    2) Technical Details: The avatar block is frontend/src/pages/Profile.tsx ~lines 296-357. With a photo\
    \ set, the <img> has NO onClick; only the small pencil badge (absolute bottom-0 right-0) opens the\
    \ hidden file input, and the initial-letter circle is clickable only when there is no photo at all\
    \ - so the circle is dead exactly when the user wants to touch it. The crop UI to reuse is frontend/src/components/common/CropModal.tsx\
    \ (react-easy-crop, aspect 1, cropShape 'round', zoom 1-3, commit via cropImageToCircle).\n\n   THE\
    \ HARD CONSTRAINT, decide it deliberately: cropImageToCircle renders a 256x256 canvas and then applies\
    \ globalCompositeOperation 'destination-in' with a circular path, so what the backend stores is ALREADY\
    \ a circle-masked 256px square. JPEG has no alpha, so those masked corners are baked in black and\
    \ are only invisible because the <img> is displayed 'rounded-full object-cover'. Consequences: (i)\
    \ re-cropping the stored file can only zoom further into an already-cropped square - it can never\
    \ recover what the first crop discarded; (ii) any viewer that shows the stored file unmasked shows\
    \ black corners. So \"change the crop\" is only honest if the ORIGINAL uncropped photo is retained.\
    \ Recommended shape: stop masking in the canvas (upload a plain square JPEG of the original) and keep\
    \ the crop rect (x/y/zoom, or a thumb path) alongside it, so the circle becomes a CSS crop of the\
    \ full photo and re-cropping is repeatable and lossless. If the ticket is deliberately kept smaller,\
    \ re-crop within the stored square is acceptable ONLY if the viewer masks it the same way and the\
    \ limitation is written on screen.\n\n   Backend, if the original is retained: app/models/user.py\
    \ (User.profile_photo_path, String(256)) needs the original path and crop fields; app/routes/auth.py\
    \ POST/DELETE /api/auth/profile-photo (POST deletes the previous file BEFORE saving the new one -\
    \ delete every derived file too, or app/uploads/profile_photos/ leaks) and GET /api/auth/uploads/<filename>\
    \ which is @login_required. Any schema change: run ./scripts/backup.sh first, migrate with FLASK_CONFIG=production\
    \ (FLASK_CONFIG=testing resolves to :memory: and writes nothing), and commit the Alembic revision\
    \ or tests/test_migrations.py fails a fresh install.\n\n   Do not break the no-double-prompt rule:\
    \ frontend/tests/e2e/profile-photo.spec.ts asserts that picking a file opens the cropper directly\
    \ (FF-0010 deleted a second picker). The new full-photo screen must be a SEPARATE entry point, not\
    \ a replacement for crop-on-pick. Existing tests that must stay green: frontend/tests/components/common/CropModal.test.tsx,\
    \ frontend/tests/pages/Profile.rows.test.tsx, frontend/tests/api/auth.test.ts, frontend/tests/store/authStore.test.ts.\
    \ Frontend tests live in frontend/tests/, never beside sources. AweFit loads the served bundle, so\
    \ a frontend-only change needs a rebuild of app/static and no backend restart; adding the crop columns\
    \ does need the restart.\n\n3) Acceptance Criteria: tapping the circle with a photo set opens a dismissible\
    \ full-screen view of the photo, not the file picker; the crop can be changed there (move/zoom or\
    \ equivalent) and saved, returning to More with the new framing visible without a manual reload; Cancel/back\
    \ closes without uploading; the view also offers Replace photo and Remove photo, where Remove confirms\
    \ and falls back to the email initial leaving no orphan file in app/uploads/profile_photos/; re-cropping\
    \ twice from the retained original can still reach any part of it; the pencil badge still starts the\
    \ new-photo flow with exactly one prompt; ./scripts/gates.sh green.\n\n\nClosed: StreakStrip component\
    \ used by the open diary, the closed panel and Home (one visual language); four dot states with no\
    \ red - on target green, closed-over blue, today open amber ring, missed hollow, future pale; tag\
    \ flips between 'close today to keep it' and 'today counts'; labelled 'this week' after discovering\
    \ that on a Sunday the strip is empty while the run length is high. BadgesSection on the More page\
    \ shows the three repeatable badges with counts, current-week progress when locked, this week's row,\
    \ and stats (days closed, perfect weeks, best streak - best streak appears nowhere else). 10 new component\
    \ tests plus updated page/panel tests. Frontend-only: no restart, no APK.\n\n[CORRECTION - coordinator\
    \ session, FF-0076] The previous note on this ticket (\"Closed: StreakStrip component used by the\
