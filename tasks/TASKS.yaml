- id: FF-0030
  title: Camera barcode scanner in AweFit
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 2
  status: blocked
  labels: []
  created_at: 2026-10-17T17:29
  updated_at: 2026-10-17T17:31
  completed_at: null
  waiting_on: null
  parent_id: null
  notes: '1) User Story: As the owner I want to point the phone camera at a product barcode and have the
    food log itself, instead of typing macros.


    2) Technical Details: Builds on FF-0014''s GET /api/food/barcode/<code> lookup. Needs a camera path
    inside the AweFit WebView: either @capacitor-mlkit/barcode-scanning (native scanner UI, adds MLKit
    to the APK and Play Services on the device) or jsQR/zxing-js over getUserMedia (keeps the APK small
    but depends on Capacitor granting CAMERA to the WebView, which must be verified on the device, not
    guessed). Decide in DECISIONS.md before implementing, add the CAMERA permission and the permission-denied
    path, and test on the phone: a scanner that cannot open the camera is worse than the typed code FF-0014
    ships.


    BLOCKED (Q3 in QUESTIONS.md): measured that http://192.168.0.224:5001 is not a secure context in Chromium
    (isSecureContext false, navigator.mediaDevices undefined), and localhost hides it - so a getUserMedia/jsQR
    scanner cannot work on the address AweFit loads. Needs either FF-0008 HTTPS first, or the native MLKit
    plugin, which needs a device to verify (permission flow, scanner sheet, Play Services, APK size).
    Typed barcode from FF-0014 is the supported path meanwhile.'
  comments: []
