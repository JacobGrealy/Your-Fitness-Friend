- id: FF-0068
  title: 'Closed-day payoff: streaks, projection on the diary, and Reopen in place of Undo'
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 2
  status: done
  labels: []
  created_at: 2026-10-17T21:43
  updated_at: 2026-10-17T21:49
  completed_at: 2026-10-17T21:49
  waiting_on: null
  parent_id: null
  notes: '1) User Story: Closing the diary should feel like a finish line worth keeping. Right now the
    payoff is a modal that disappears, the projection lives only inside it, and nothing rewards a run
    of closed days. The owner wants streaks and a closed state on the diary page itself that discourages
    adding more food after closing.


    2) Technical Details: three changes. (a) STREAKS - completion_streaks(user_id, as_of, goal_calories)
    computed from diary_completions rows: closed_days (consecutive days with a completion row) and within_goal_days
    (consecutive closed days where 0 < calories <= goal * 1.10, so under goal counts as within). Both
    use "current run" semantics: count back from the most recent qualifying day, and return 0 if that
    day is older than yesterday, so a broken streak reads as broken instead of as a stale number. (b)
    The projection moves onto the diary page: when closed, a panel sits directly under CalorieSummaryBar
    (the goal/food/exercise line) showing the five-week projection, the two streaks, and a Reopen button;
    the bottom Diary-complete/Undo row is removed entirely, so Reopen lives inside the closed panel as
    asked. (c) Gamification for the open state: a small streak hint above the Complete Diary button when
    a run exists ("3 days in a row - close today to keep it"), and the completion modal shows both streaks
    and renames Undo to Reopen for consistent language. Backend: GET /api/food/diary/completion must return
    the full closed payload (totals, projection, streaks, message) rather than only the totals, so the
    panel renders from one call; add a shared summary builder used by both POST and GET, keeping the existing
    `streak` key as an alias of closed_days. Tests: streak maths including the exact 110% boundary, empty
    closed days excluded from the goal streak, a gap resetting the count, a run older than yesterday reading
    as 0, no rows at all, and GET returning the closed payload; frontend tests for the closed panel (projection,
    both streaks, Reopen wired), the open-state hint, and the modal copy.


    Closed: backend completion_streaks() (closed_days + within_goal_days with a 10% ceiling, under-goal
    always counts, current-run semantics that return 0 once the latest qualifying day is older than yesterday)
    and summarise_record() shared by POST and GET so /completion returns the full closed payload. Frontend:
    ClosedDayPanel under the CalorieSummaryBar with projection + both streaks + Reopen; bottom Diary-complete/Undo
    row removed; open state shows a streak nudge; modal shows both counters and calls the exit Reopen.
    Fixed a bug found by screenshot: the modal re-popped on every load of a closed day (split closedSummary
    from completion). Verified in-browser and on a throwaway server (3 closed days -> closed 3, within
    3). Tests: 33 backend in the diary file, 16 frontend. Backend half needs a restart.'
