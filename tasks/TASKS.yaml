  parent_id: null
  notes: '1) User Story: The scanner works, but a barcode can still fail to read when the packet is held
    upright in the frame or when the kitchen is dark, which would look like the scanner breaking again.


    2) Technical Details: measured, not assumed. A horizontal EAN-13 decodes in ~1ms; the SAME barcode
    rotated a quarter turn takes ~23ms and returns nothing, because ZXing''s 1D readers only scan horizontal
    rows. A phone in portrait with the packet sideways - or a WebView that hands frames over rotated relative
    to the preview - is therefore enough to make the scanner look dead. Added rotateLuminance() and a
    quarterTurns option to decodeFrame(); BarcodeScanner tries [0] every tick and all four orientations
    every third tick, so the cost (~90ms worst case) stays inside the 125ms cadence. Also requests width
    1280/height 720 and offers a torch toggle when the camera exposes one (track.getCapabilities().torch),
    since a dark kitchen is the other common reason nothing decodes. Tests: 4 rotation tests plus a sideways-bitmap
    decode that asserts upright-only misses and the four-way attempt finds it (20 barcode tests total).
    Frontend-only: no rebuild, no migration. Verify the rotation path with the synthetic-camera harness
    (canvas.captureStream drawing a rotated EAN-13) rather than the phone.'
