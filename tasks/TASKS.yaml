- id: FF-0073
  title: Opening a saved weight entry shows no photo, and saving it deletes the photo it had
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 1
  status: done
  labels: []
  created_at: 2026-10-18T09:43
  updated_at: 2026-10-18T10:06
  completed_at: 2026-10-18T10:06
  waiting_on: null
  parent_id: null
  notes: "1) User Story: I attach a photo to a weigh-in, then later open that saved entry from Weight\
    \ History and the photo is not there - it shows the \"Tap to take a photo\" placeholder. Sometimes\
    \ the entry I remember having a photo has lost it entirely. Either way the photo I took is unreachable\
    \ from the app, which is the whole point of taking it.\n\n2) Evidence on the live box (read-only,\
    \ instance/fitness_friend.db): app/uploads/weight_photos/ holds 6 files but only 2 are referenced\
    \ by any weight_logs row - 24212fcc..., 32280147..., 4bab93d9... and f74e4c9a... are orphans. Only\
    \ 2 of 10 rows have a photo_url at all, including the two newest (2026-10-17, 2026-10-18). Uploads\
    \ that never got attached are the fingerprint of the bug family below.\n\n3) Technical Details - three\
    \ separate defects, all in frontend/src/pages/Weight/EditWeight.tsx, all one root cause: the store\
    \ field `uploadedPhotoUrl` is used as both \"did I just upload\" and \"what should be saved\".\n\n\
    \   a) DESTRUCTIVE SAVE, the likely cause of the reported symptom. onSubmit (line ~104) sends `photo_url:\
    \ uploadedPhotoUrl || null`. That field is zustand state set only by an upload in the current session,\
    \ and it is NOT reset when EditWeight mounts. So for an entry that already has a photo: open it, change\
    \ nothing (or just the weight), save - the PUT carries photo_url: null. app/routes/weight.py update_log\
    \ does `if 'photo_url' in data: log.photo_url = data['photo_url']`, so the key being present with\
    \ null erases the column, while the file stays on disk as an orphan. Every later open then shows no\
    \ photo. That is silent data loss and it matches \"it was there and now it is gone\".\n\n   b) STALE\
    \ CLOSURE when saving with a freshly picked file. `if (selectedFile && !uploadedPhotoUrl) await handleUploadPhoto()`\
    \ - handleUploadPhoto returns nothing, and `uploadedPhotoUrl` inside onSubmit is the value captured\
    \ at render time, so the photo_url line below still reads null. Picking a file and pressing Save (instead\
    \ of tapping the separate \"Upload Photo\" button first) uploads the bytes and then writes null: an\
    \ orphan file plus an entry that ignores it. The same pattern is in frontend/src/pages/Weight/LogWeight.tsx\
    \ onSubmit and handleReplace (create path).\n\n   c) STALE STATE HIDES A SAVED PHOTO. The render guard\
    \ is `initialPhotoUrl && !uploadedPhotoUrl` (line ~187). Because uploadedPhotoUrl is module-level\
    \ store state that survives navigation - only logWeight/replaceEntry clear it, updateLog does not\
    \ - an upload from an earlier screen in the session makes the entry's real photo fall through to the\
    \ \"Tap to take a photo\" placeholder. This is the purely-cosmetic version of the report and is fixed\
    \ by the same change.\n\n   Fix shape: stop reading store state for photo decisions. Hold photo intent\
    \ locally in EditWeight - initialPhotoUrl from the fetched log, an optional new File, and an explicit\
    \ removal flag - and only include photo_url in the PUT when the user actually changed the photo; send\
    \ an explicit null only for a deliberate removal. Make the upload hand back its URL (`const url =\
    \ await uploadPhoto(file)`) instead of re-reading the closure. Reset the store field on mount so it\
    \ cannot leak into the next screen. Give the same treatment to LogWeight.\n\n   Backend: `if 'photo_url'\
    \ in data` in update_log is the correct preserve-by-omitting hook - do NOT relax it to data.get('photo_url')\
    \ with a default, or every client that omits the key starts wiping photos. If the replaced file should\
    \ be cleaned up, delete it server-side on update; the 4 orphans above are what falling short of that\
