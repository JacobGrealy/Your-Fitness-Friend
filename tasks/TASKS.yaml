  parent_id: null
  notes: '1) User Story: When a new AweFit build is published, updating means opening a URL in the phone
    browser, getting past Chrome''s "this type of file can harm your device" warning, then finding and
    opening the download. It should be one tap inside the app: "Update", then the system installer.


    2) Technical Details: Today frontend/src/native.ts has getRunningAppVersion (CapacitorApp.getInfo),
    isUpdateAvailable(runningBuild, publishedVersionCode) comparing against /api/app/version, and openExternalUrl
    which hands the URL to @capacitor/browser (a Custom Tab) - so the app opens the download page but
    leaves the download and install to the browser. Options, cheapest first: (a) keep openExternalUrl
    but verify it actually triggers a download in the Custom Tab rather than rendering the APK; (b) use
    @capacitor/filesystem to fetch /download/awefit.apk into the app cache, then hand the file to Android
    with an ACTION_VIEW intent (mime application/vnd.android.package-archive) through a FileProvider -
    this needs a <provider> FileProvider entry in frontend/android/app/src/main/AndroidManifest.xml plus
    a file_paths.xml, the REQUEST_INSTALL_PACKAGES permission, and likely a small custom Capacitor plugin
    since no maintained plugin exposes the installer intent; (c) leave it as it is. Whichever route is
    chosen, the acceptance criterion is the user''s flow on the phone: tap Update in the banner -> one
    system prompt at most -> the Android installer opens with versionCode 4 and installs over 3, keeping
    data. NOTE: the final permission/installer flow cannot be verified from this host - only the JS/code
    path can be tested here, so the ticket must state that the on-device check needs the owner, exactly
    as the camera scanner did. Also note the signed release already exists at releases/awefit.apk served
    by /download/awefit.apk (verified live), and versionCode must exceed the installed build or Android
    refuses the install.


    Closed (pending on-device verification): local Capacitor plugin ApkInstallerPlugin.java downloads
    the APK off the UI thread, checks ZIP magic/size, and fires ACTION_VIEW via the existing FileProvider;
    REQUEST_INSTALL_PACKAGES added; registered in MainActivity before super.onCreate; native.ts installApkUpdate()
    returns installing/browser/permission-required and falls back to the Custom Tab on any failure. 5
    jest tests. APK 0.1.4 (versionCode 5) built - Gradle compiled the Java and merged the manifest; verified
    inside the APK that the plugin is in classes.dex, the permission is present and the FileProvider authority
    is dev.awefit.app.fileprovider. Phone verification outstanding: banner needs a newer published build,
    so run 0.1.4 while 0.1.5 exists.'
