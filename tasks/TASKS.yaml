- id: FF-0083
  title: Split edit into log-serving and food-detail screens, and make the macro unit explicit
  source: user
  projects:
  - awecraft
  assignee: opencode
  priority: 1
  status: done
  labels: []
  created_at: 2026-10-18T12:16
  updated_at: 2026-10-18T20:46
  completed_at: 2026-10-18T20:46
  waiting_on: null
  parent_id: null
  notes: '1) User Story: changing Number of Servings while editing a food log does not change the macros,
    although it does on create. More broadly the owner wants the edit flow split in two: landing on a
    LOG screen (adjust the serving) with a button through to a FOOD screen (macros per serving, name,
    brand), and the food screen must not offer Number of Servings because that is a log property.


    2) Root cause - three inconsistent paths, verified in the code and in live data. (a) frontend/src/store/foodStore.ts:139-148
    logFood multiplies only when the food is present in the store: totalCalories = round(food.calories
    * quantity). (b) When the food is NOT in the store the else-branch posts data.calories as typed, so
    the unit is ambiguous. (c) frontend/src/pages/Food/EditFoodLog.tsx sends calories and number_of_servings
    verbatim with no scaling, so the field does nothing. Live proof: food_logs 64 holds 110 kcal at number_of_servings
    0.5 where the food is 110 kcal per serving (should be 55), and log 62 holds 38 kcal at 0.2 servings
    (food is 38) - both carry per-serving numbers with a multiplier that was never applied. So food_logs.calories
    sometimes means a total and sometimes a per-serving value: that ambiguity is the real bug.


    3) Proposed model: make the unit explicit by storing per-serving nutrition on the log. Add calories_per_serving,
    protein_per_serving, carbs_per_serving, fat_per_serving to food_logs, keep the existing columns as
    TOTALS (so every consumer - diary sums, dashboard, streaks - keeps working unchanged), and define
    totals = per_serving * number_of_servings everywhere. Backfill: per_serving = totals / servings for
    rows with servings > 0, else totals; flag the rows where that heuristic disagrees with the linked
    Food (logs 62 and 64 above) for review rather than silently rewriting them. One helper computes both
    directions so no client does the arithmetic.


    4) Proposed UX - two screens. LOG screen (weighted first, reached from the diary row): servings control
    with live totals updating as it changes, plus date, meal type, photo, notes, and the barcode as read-only.
    Buttons: Save, Edit food details, Delete. FOOD screen (reached from that button): name, brand, serving
    size, calories and macros PER SERVING, and NO servings field. Saving the food screen recomputes this
    log''s totals at its current servings.


    5) Open questions for the owner (asked in the conversation, not decided here): whether saving the
    FOOD screen should also update the saved Food so future logs use it (always / ask via a ''use for
    future logs'' toggle defaulting on / never); the servings control shape (free decimal vs stepper plus
    quick chips); whether the LOG screen should also allow moving the entry to another date or meal; what
    to do for logs with no food reference (hide the food screen or let it edit the log''s own snapshot);
    whether to repair logs 62 and 64 during the migration; and rounding rules (whole calories, one decimal
    for macros).


    6) Interaction with FF-0082: a copied meal must copy snapshots, including the per-serving values,
    so this lands before or with the copy feature to avoid a second migration. Also touches the create
    screen labels (''per serving'' vs ''total'') which should match the new model.


    DECISIONS from the owner (2026-10-18): 1) saving the FOOD screen also updates the saved Food so future
    logs use it. 2) servings accepts an exact decimal AND offers quick selections. 3) the LOG screen may
    move an entry to another date - that is not the same as copying. 4) logs with no food reference edit
    their own snapshot on the FOOD screen. 5) do NOT change any existing logs - the migration must add
    the per-serving columns without altering stored totals. 6) keep precision internally, display up to
    two decimals. Split for delivery: this ticket carries the model and the arithmetic (migration, helper,
    endpoints, tests) so the reported bug is fixed in the existing form, and the two-screen split follows
    as its own ticket once this lands.


    Closed (data + API half): food_logs gains calories/protein/carbs/fat_per_serving via migration 5274c85d8204
    which backfills by dividing and does NOT alter any stored total (verified on the live db before/after).
    app/utils/serving.py owns the conversion; _apply_nutrition() gives create and update one rule - explicit
    per-serving wins, else explicit totals (legacy clients), else a serving-count change rescales from
    the stored per-serving value, which is the reported bug. 8 new tests (doubling, halving, round trip,
    1.33x decimal, per-serving edit, food update propagation, legacy totals client). Gates green, 218
    backend tests. REMAINING: the two-screen UI split (log screen with exact decimal + quick chips, food
    screen without a servings field, foods screen for detached logs, date move on the log screen) - filed
    as FF-0086 so the visible symptom is fixed there. Frontend half of this ticket: the form still sends
    totals.'
