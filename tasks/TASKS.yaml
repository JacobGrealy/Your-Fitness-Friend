- id: FF-0062
  title: 'Scanner hardening: read upright codes and offer a torch'
  source: agent
  projects:
  - awecraft
  assignee: opencode
  priority: 3
  status: done
  labels: []
  created_at: 2026-10-17T21:15
  updated_at: 2026-10-17T21:21
