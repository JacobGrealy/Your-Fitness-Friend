    _FIELDS, and scale the per-100g values by the declared serving mass - serving_quantity when present,
    else a mass parsed out of serving_size (''15 g'', ''25g'', ''30 ml'', ''1.5 oz'' via a unit table)
    - computing calories/protein/carbs/fat for that serving and leaving serving_size as the human label.
    When the serving is not a mass at all (''1 cup'', ''1 bar''), do NOT scale and label the serving as
    100 g, so the number and the label agree. Needs a helper serving_mass_g() and tests: 25 g serving
    of 400 kcal/100 g -> 100 kcal (the exact 4x case), 15 g -> 81, ''1 cup'' -> unscaled with a 100 g
    label, kJ-only input still converts, and a product with no serving data behaves as before. Also check
    the search path if it shares parse_product. Backend-only, but it needs a restart, and already-cached
    Food rows keep their wrong numbers - the ticket should say so rather than pretend otherwise.


